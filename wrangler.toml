# Cloudflare Pages (solo alojamiento de la web). El nombre debe coincidir con el proyecto de Pages.
# Los archivos (EPUB, portadas, fotos) viven en Supabase Storage (bucket privado `ucronia-libros`): no hay bindings de almacenamiento.
name = "biblioteca-ucronia"
pages_build_output_dir = "./dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Plan gratuito: 10 ms de CPU por petición. Límite de EPUB seguro; súbelo solo con Workers de pago.
# (Supabase gratis admite hasta 50 MB por archivo; el bucket está limitado a 20 MB en 0006_storage.sql.)
MAX_EPUB_MB = "15"
# Respaldo en GitHub: "usuario/repositorio". El token va como secreto GITHUB_DISPATCH_TOKEN.
GITHUB_BACKUP_REPO = ""
